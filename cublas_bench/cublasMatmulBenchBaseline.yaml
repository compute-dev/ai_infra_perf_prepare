# cuBLAS GEMM official TFLOPS baseline
#
# Structure: GPU model -> precision -> official TFLOPs
#   - Explicit key addressing (not positional), eliminating the
#     "wrong cell, no one notices" misalignment bug of CSV.
#   - Missing/N/A values: simply omit the key (do not write null or '_');
#     the parser treats absent keys as "no baseline, skip".
#   - Available precisions: FP4 FP8 INT8 FP16 BF16 TF32 FP32
#
# Read by parse_cublas_simple.py; after editing, self-check with:
#   python3 -c "import yaml; yaml.safe_load(open('cublasMatmulBenchBaseline.yaml'))"

